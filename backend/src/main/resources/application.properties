server.port=8080
spring.application.name=Hyno Nutrition API
spring.datasource.url=jdbc:mysql://localhost:3306/nutritiondb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=appuser
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
jwt.secret=hynoSecretKey2024VeryLongAndSecure
jwt.expiration=86400000
logging.level.com.hyno.nutrition=DEBUG
logging.level.org.springframework.security=DEBUG
